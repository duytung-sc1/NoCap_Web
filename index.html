    <script id="nocap-site-theme-init">
      (() => {
        let theme = 'light';
        try {
          const saved = localStorage.getItem('nocap-site-theme-v1');
          if (saved === 'dark' || saved === 'sage') theme = saved;
        } catch {}
        document.documentElement.dataset.siteTheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', { light: '#fdfcf8', dark: '#111b19', sage: '#edf2e8' }[theme]);
      })();
    </script>
    <style>
@font-face{font-family:'NoCap Startup VI';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/be-vietnam-pro-vietnamese-700.woff2') format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'NoCap Startup VI';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/be-vietnam-pro-latin-700.woff2') format('woff2')}
@font-face{font-family:'NoCap Startup EN';font-style:normal;font-weight:200 800;font-display:swap;src:url('/fonts/plus-jakarta-sans-english.woff2') format('woff2')}
:root{--startup-font:'NoCap Startup VI',sans-serif}:root:lang(en){--startup-font:'NoCap Startup EN',sans-serif}

      html,body{margin:0;background:var(--site-bg,#fdfcf8)}
      .nocap-startup{min-height:100svh;display:grid;place-content:center;gap:16px;max-width:600px;margin:auto;padding:40px 24px;color:var(--site-text,#20252a);background:var(--site-bg,#fdfcf8);font:700 15px/1.7 var(--startup-font);text-align:center;box-sizing:border-box}
      .nocap-startup h1,.nocap-startup p{margin:0}.nocap-startup h1{font-size:22px}.nocap-startup-brand{font:700 30px var(--startup-font);letter-spacing:.08em}.nocap-startup p{color:var(--site-muted,#5b646b)}.nocap-startup a,.nocap-startup button{display:inline-block;border:1px solid var(--site-line,#d4dcd7);border-radius:8px;padding:10px 18px;background:var(--site-raised,#f1f3f0);color:var(--site-text,#20252a);font:inherit;text-decoration:none;cursor:pointer}.nocap-startup :focus-visible{outline:3px solid var(--site-accent,#252d33);outline-offset:4px}.nocap-startup [hidden]{display:none}
    </style>

  <body>
    <div id="root">
      <section id="nocap-startup" class="nocap-startup" role="status" aria-live="polite">
        <div class="nocap-startup-brand">NOCAP</div>
        <h1 data-startup-title>NoCap — không gian đọc và ghi nhớ</h1>
        <p data-startup-description>Đang tải ứng dụng NoCap. Giao diện sẽ hiện khi tải xong.</p>
        <p>NoCap giúp bạn khám phá sách, đọc tài liệu, lưu ghi chú và ôn tập những ý tưởng muốn ghi nhớ.</p>
        <div data-startup-recovery hidden><a href="">Thử tải lại trang</a><p>Tải lại trang không xóa sách và ghi chú đã lưu.</p></div>
        <p><a href="/explore">Khám phá sách trên NoCap</a></p>
        <noscript>
          <style>
            #nocap-startup [data-startup-title],#nocap-startup [data-startup-description]{display:none}
            #nocap-fallback-faq-content{text-align:left;margin-top:20px}
            #nocap-fallback-faq-content h1{margin:0 0 10px}
            #nocap-fallback-faq-content details{padding:12px 0;border-bottom:1px solid var(--site-line,#d4dcd7)}
            #nocap-fallback-faq-content summary{cursor:pointer}
            #nocap-fallback-faq-content details p{margin:8px 0 0;font-weight:400}
          </style>
          <p>Bạn cần bật JavaScript trong trình duyệt để sử dụng NoCap.</p>
          <section id="nocap-fallback-faq-content" lang="vi" aria-labelledby="nocap-fallback-faq">
            <h1 id="nocap-fallback-faq">Tìm hiểu về NoCap</h1>
            <p>Những điều cần biết trước khi bắt đầu đọc và ghi nhớ.</p>
            <details>
              <summary>NoCap là gì?</summary>
              <p>NoCap là không gian đọc sách số và tài liệu, giúp bạn lưu ghi chú, sắp xếp tủ sách và xem lại những ý đã lưu. Bạn có thể sử dụng NoCap trên web và ứng dụng Android.</p>
            </details>
            <details>
              <summary>NoCap hỗ trợ những loại tài liệu nào?</summary>
              <p>Trên web, bạn có thể thêm EPUB, PDF, DOCX, TXT, Markdown, HTML, CBZ và các tệp ảnh JPG, PNG hoặc WebP. Nội dung có thể chọn hoặc tìm kiếm tùy theo định dạng và cấu trúc của từng tệp.</p>
            </details>
            <details>
              <summary>Tôi có thể ghi chú và tìm lại đoạn đã đọc không?</summary>
              <p>Bạn có thể lưu ghi chú khi đọc, xem lại trong mục Ghi nhớ và mở về vị trí gốc nếu tài liệu còn khả dụng. Với PDF chỉ gồm ảnh quét, việc chọn và tìm chữ có thể không khả dụng.</p>
            </details>
            <details>
              <summary>Tôi có cần tài khoản để bắt đầu không?</summary>
              <p>Bạn có thể thêm tài liệu và đọc trong trình duyệt ở chế độ khách. Đăng nhập để sử dụng các tính năng đồng bộ; một số tính năng đám mây có thể yêu cầu xác thực email.</p>
            </details>
            <details>
              <summary>Tôi có thể đọc khi không có mạng không?</summary>
              <p>Trên web, tài liệu đã lưu trên trình duyệt hoặc đã tải để đọc ngoại tuyến có thể được mở khi không có mạng. Bạn cần kết nối để tải nội dung lần đầu và sử dụng các tính năng trực tuyến.</p>
            </details>
          </section>
        </noscript>
      </section>
    </div>
    <script id="nocap-startup-watchdog">
      (() => {
        const screen = document.getElementById('nocap-startup');
        if (!screen) return;
        let timer;
        const cleanup = () => {
          window.clearTimeout(timer);
          observer.disconnect();
          window.removeEventListener('error', onError, true);
          window.removeEventListener('unhandledrejection', onRejection);
        };
        const showRecovery = (failed) => {
          if (!screen.isConnected) { cleanup(); return; }
          window.clearTimeout(timer);
          screen.querySelector('[data-startup-title]').textContent = failed ? 'NoCap chưa khởi động được' : 'Trang đang tải lâu hơn bình thường';
          screen.querySelector('[data-startup-description]').textContent = failed ? 'Không tải hoặc khởi động được tệp ứng dụng. Bạn có thể thử tải lại trang.' : 'Ứng dụng chưa tải xong. Hãy kiểm tra kết nối mạng hoặc thử tải lại trang.';
          screen.querySelector('[data-startup-recovery]').hidden = false;
        };
        const onError = (event) => {
          if (event.error || (event.target && event.target.tagName === 'SCRIPT' && event.target.type === 'module')) showRecovery(true);
        };
        const onRejection = () => showRecovery(true);
        const observer = new MutationObserver(() => { if (!screen.isConnected) cleanup(); });
        observer.observe(document.getElementById('root'), {childList:true});
        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', onRejection);
        timer = window.setTimeout(() => showRecovery(false), 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
